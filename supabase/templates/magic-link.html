<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f2e8;color:#12130f;font-family:Arial,sans-serif;">
    <div style="margin:0 auto;max-width:560px;padding:40px 24px;">
      <p style="margin:0 0 28px;color:#295a42;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;">Lemhi Cohort Portal</p>
      <div style="background:#fffdf8;border:1px solid #d8d2c6;border-radius:12px;padding:32px;">
        <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:32px;line-height:1.1;">Sign in to your cohort</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Use this secure, one-time link to return to the Lemhi Cohort Portal.</p>
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink" style="display:inline-block;background:#295a42;border-radius:6px;color:#ffffff;font-size:16px;font-weight:700;padding:14px 20px;text-decoration:none;">Sign in securely</a>
        <p style="margin:24px 0 0;color:#65675f;font-size:14px;line-height:1.5;">This link expires in one hour. If you didn’t request it, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
